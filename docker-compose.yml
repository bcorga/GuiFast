version: '3.8'

services:
  frontend:
    build:
      context: ./services/frontend
    ports:
      - "3000:3000" # Puerto expuesto para el frontend
    volumes:
      - ./services/frontend:/app
      - /app/node_modules # Para evitar conflictos con los módulos de Node.js
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - WATCHPACK_INTERVAL=1000 # Opcional: Define un intervalo de 1 segundo
    command: npm run dev 

  backend:
    build:
      context: ./services/api
    ports:
      - "5000:5000" # Puerto expuesto para el backend
    depends_on:
      database:
        condition: service_healthy
    
    volumes:
      - ./services/api:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:ps1root@database:5432/guion_platform
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - SMTP_HOST=mailhog       # Nombre del servicio MailHog en Docker Compose
      - SMTP_PORT=1025          # Puerto SMTP interno de MailHog
      - SMTP_SECURE=false     # MailHog no usa SSL/TLS

  model:
    build:
      context: ./services/ai
    ports:
      - "8000:8000" # Puerto expuesto para el modelo de IA
    volumes:
      - ./services/ai:/app
    env_file: 
      - .env

  database:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ps1root
      POSTGRES_DB: guion_platform
    ports:
      - "5432:5432" # Puerto de PostgreSQL para conectar desde otros servicios
    volumes:
      - postgres_data:/var/lib/postgresql/data # Persistencia de datos
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      # Mapea el archivo local servers.json al lugar donde pgAdmin lo busca
      - ./servers.json:/pgadmin4/servers.json 
    depends_on:
      - database
  mailhog:
    image: mailhog/mailhog
    logging:
      # Deshabilita el logging para que no se saturen tus logs
      driver: none
    ports:
      # Puerto SMTP (para que tu aplicación envíe correos)
      - "1025:1025"
      # Puerto de la interfaz web (para que tú los veas)
      - "8025:8025"

volumes:
  postgres_data: # Volume persistente para la base de datos